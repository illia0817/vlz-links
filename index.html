<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #4aa8ff;
    --accent-soft: rgba(74, 168, 255, .35);
    --metal-hi: #dbe6f5;
    --metal-lo: #8fa2bd;
  }

  body {
    min-height: 100svh;
    font-family: 'Oswald', system-ui, sans-serif;
    color: #fff;
    background: #050b1e url("arena.jpg") center / cover no-repeat fixed;
    display: flex;
    justify-content: center;
    /* на айфоне снизу системная панель, поэтому запас через safe-area */
    padding: 40px 20px calc(32px + env(safe-area-inset-bottom));
  }
  /* затемнение, чтобы текст читался на любом фоне */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 90% 55% at 50% 8%, rgba(74,168,255,.18), transparent 60%),
      linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.55) 40%, rgba(0,0,0,.88) 100%);
  }

  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; }

  header { text-align: center; margin-bottom: 30px; }

  .logo {
    width: 132px; height: 132px; object-fit: contain;
    filter: drop-shadow(0 0 26px var(--accent-soft)) drop-shadow(0 10px 22px rgba(0,0,0,.8));
  }

  h1 {
    margin-top: 14px;
    font-size: 27px; font-weight: 700; letter-spacing: 1px; line-height: 1.2;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff 14%, var(--metal-hi) 46%, var(--metal-lo) 66%, #fff 92%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    /* запас снизу: у «Ж» і «Ц» хвости виходять за рядок */
    padding-bottom: .12em;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.8));
  }

  .season {
    margin-top: 8px;
    font-size: 14px; font-weight: 500; letter-spacing: 5px;
    color: var(--accent);
    text-shadow: 0 0 16px var(--accent);
  }

  nav { display: flex; flex-direction: column; gap: 12px; }

  a.link {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 20px;
    border-radius: 16px;
    text-decoration: none; color: #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 1px 10px rgba(255,255,255,.1);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  a.link:hover {
    border-color: rgba(255,255,255,.45);
    box-shadow: 0 8px 26px rgba(0,0,0,.45), 0 0 30px var(--accent-soft), inset 0 1px 12px rgba(255,255,255,.16);
  }
  a.link:active { transform: scale(.98); }

  /* главная кнопка выделена: с неё начинается путь в наш канал */
  a.link.primary {
    background: linear-gradient(180deg, rgba(74,168,255,.32), rgba(74,168,255,.14));
    border-color: rgba(120,190,255,.6);
    box-shadow: 0 8px 26px rgba(0,0,0,.4), 0 0 34px var(--accent-soft), inset 0 1px 12px rgba(255,255,255,.2);
  }

  a.link svg { width: 26px; height: 26px; flex-shrink: 0; fill: #fff; }
  a.link span {
    font-size: 19px; font-weight: 600; letter-spacing: 1px;
  }
  a.link .arrow {
    margin-left: auto; font-size: 20px; color: rgba(255,255,255,.45);
  }

  footer {
    margin-top: 30px; text-align: center;
    font-size: 12px; font-weight: 400; letter-spacing: 2px; line-height: 1.7;
    color: rgba(255,255,255,.5);
  }
  /* подпись автора: тихая, не перетягивает внимание со ссылок */
  .author {
    margin-top: 18px; text-align: center;
    font-size: 10px; font-weight: 400; letter-spacing: 1.5px;
    color: rgba(255,255,255,.28);
  }
  .author a {
    color: rgba(255,255,255,.42);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,.18);
    transition: color .15s ease, border-color .15s ease;
  }
  .author a:hover { color: rgba(255,255,255,.75); border-color: rgba(255,255,255,.5); }
</style>
</head>
